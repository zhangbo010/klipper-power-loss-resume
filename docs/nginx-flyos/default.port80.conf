# FlyOS 风格：监听 80，仅反向代理（无 static root）
# 使用前请替换 {{DEFAULT_PORT}} 为 9080 或 9081（默认首页用哪个 UI）
# 放入 sites-available 后 ln -s 到 sites-enabled，并 nginx -t 重载

server {
    listen 80;

    client_max_body_size 0;
    proxy_request_buffering off;

    # 无尾部斜杠时重定向，避免 /m 落到 location / 走错站
    location = /m { return 301 /m/; }
    location = /f { return 301 /f/; }
    location = /fluidd { return 301 /fluidd/; }
    location = /mainsail { return 301 /mainsail/; }

    # /f 或 /fluidd → Fluidd（9080）
    location /f/ {
        proxy_pass http://127.0.0.1:9080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /fluidd/ {
        proxy_pass http://127.0.0.1:9080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /m 或 /mainsail → Mainsail（9081）
    location /m/ {
        proxy_pass http://127.0.0.1:9081/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /mainsail/ {
        proxy_pass http://127.0.0.1:9081/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 默认首页（默认 Fluidd 或默认 Mainsail）
    location / {
        proxy_pass http://127.0.0.1:{{DEFAULT_PORT}}/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
